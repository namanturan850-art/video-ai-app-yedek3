name: Windows NAMAN CPU smoke
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-editor:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      AVS_OFFLINE_TESTS: '1'
      NAMAN_PLAYBACK_REPORT: ${{ runner.temp }}/naman-playback-results.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg with Chocolatey
        run: choco install ffmpeg --no-progress -y
      - name: CPU API SQLite FFmpeg checks
        run: python -m pytest tests/test_editor_polish.py tests/test_advanced_editing.py tests/test_advanced_render.py tests/test_desktop.py tests/test_preview_playback.py tests/test_continuous_preview.py tests/test_proxy_audio_state.py -q
      - name: Windows local diagnostics
        run: python scripts/windows_editor_check.py --output windows-editor-report.json
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
      - name: Cold-cache continuous playback (64 seconds)
        run: python scripts/preview_playback_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playback-measurement
          path: ${{ runner.temp }}/naman-playback-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-report
          path: windows-editor-report.json
