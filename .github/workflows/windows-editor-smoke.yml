name: Windows NAMAN CPU smoke
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      playback_seconds:
        description: 'Soğuk önbellek oynatma testi (saniye)'
        type: choice
        options: ['64', '180']
        default: '180'
permissions:
  contents: read
jobs:
  cpu-editor:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      AVS_OFFLINE_TESTS: '1'
      # Turkish output must not crash on the Windows cp1252 console.
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
      NAMAN_PLAYBACK_SECONDS: ${{ inputs.playback_seconds || '64' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Browser clock and buffer unit tests
        shell: pwsh
        run: |
          $testFiles = Get-ChildItem tests/frontend -Filter '*.test.cjs' | ForEach-Object { $_.FullName }
          node --test $testFiles
      - name: Install pinned test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Install FFmpeg with Chocolatey
        run: choco install ffmpeg --no-progress -y
      - name: FFmpeg crash probe (version and a tiny filter graph)
        shell: pwsh
        run: |
          ffmpeg -version | Select-Object -First 2
          choco list ffmpeg --local-only
          choco search ffmpeg --exact --all-versions | Select-Object -First 8
          ffmpeg -v error -y -f lavfi -i anullsrc=r=48000:cl=mono -t 0.001 -f f32le NUL
          Write-Host "probe exit code: $LASTEXITCODE"
      - name: CPU API SQLite FFmpeg checks
        run: python -m pytest tests/test_editor_polish.py tests/test_advanced_editing.py tests/test_advanced_render.py tests/test_desktop.py tests/test_preview_playback.py tests/test_continuous_preview.py tests/test_proxy_audio_state.py tests/test_source_timing.py tests/test_manual_jobs.py -q -rf --tb=short --junitxml=pytest-report.xml
      - name: Failed test summary
        if: failure()
        shell: python
        run: |
          import os, xml.etree.ElementTree as ET
          if not os.path.exists('pytest-report.xml'):
              print('::error title=pytest::pytest-report.xml was not produced; pytest did not finish collecting.')
          else:
              root = ET.parse('pytest-report.xml').getroot()
              bad = [(case, child) for case in root.iter('testcase') for child in case if child.tag in ('failure', 'error')]
              print(f'{len(bad)} failing test(s)')
              for case, child in bad[:10]:
                  text = (child.get('message') or '') + ' | ' + (child.text or '')[-600:]
                  text = text.replace('%', '%25').replace('\r', '').replace('\n', '%0A')[:900]
                  print(f"::error title={case.get('classname')}.{case.get('name')}::{text}")
      - name: Windows local diagnostics
        if: ${{ !cancelled() }}
        run: python scripts/windows_editor_check.py --output windows-editor-report.json
      - name: Install browser test tools
        if: ${{ !cancelled() }}
        run: |
          python -m pip install playwright==1.62.0
          python -m playwright install chromium
      - name: Cold-cache continuous playback
        if: ${{ !cancelled() }}
        env:
          # `runner` is not available in job-level env, only in step-level env.
          NAMAN_PLAYBACK_REPORT: ${{ runner.temp }}/naman-playback-results.json
          # Playwright's bundled Chromium has no H.264; the installed Chrome (like WebView2) does.
          NAMAN_BROWSER_EXECUTABLE: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: python scripts/ci_annotated_run.py "Cold-cache playback" -- python scripts/preview_playback_browser_smoke.py
      - name: Real video sources at 720p
        if: ${{ !cancelled() }}
        env:
          NAMAN_PLAYBACK_SECONDS: '12'
          NAMAN_PLAYBACK_REAL_VIDEOS: '1'
          NAMAN_PLAYBACK_REPORT: ${{ runner.temp }}/naman-real720.json
          NAMAN_BROWSER_EXECUTABLE: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: python scripts/ci_annotated_run.py "Real video 720p" -- python scripts/preview_playback_browser_smoke.py
      - name: Real video sources at 1080p
        if: ${{ !cancelled() }}
        env:
          NAMAN_PLAYBACK_SECONDS: '12'
          NAMAN_PLAYBACK_REAL_VIDEOS: '1'
          NAMAN_PLAYBACK_QUALITY: full
          NAMAN_PLAYBACK_REPORT: ${{ runner.temp }}/naman-real1080.json
          NAMAN_BROWSER_EXECUTABLE: 'C:\Program Files\Google\Chrome\Application\chrome.exe'
        run: python scripts/ci_annotated_run.py "Real video 1080p" -- python scripts/preview_playback_browser_smoke.py
      - name: Large JSON file and explicit draft approval
        if: ${{ !cancelled() }}
        env:
          NAMAN_MANUAL_IMPORT_REPORT: ${{ runner.temp }}/naman-manual-import-ui.json
        run: python scripts/manual_import_browser_smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-playback-measurement
          path: |
            ${{ runner.temp }}/naman-playback-results.json
            ${{ runner.temp }}/naman-real720.json
            ${{ runner.temp }}/naman-real1080.json
            ${{ runner.temp }}/naman-manual-import-ui.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-editor-report
          path: windows-editor-report.json
